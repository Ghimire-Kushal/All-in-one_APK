# Keep builds responsive on laptops. This app does not need an 8 GB Gradle
# heap or unlimited worker parallelism, both of which can cause excessive heat.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
android.useAndroidX=true
android.enableR8.fullMode=true
android.enableResourceOptimizations=true
